  pages:
    # まばたき入力（カメラ）のデータの扱い。カメラが動く PR3b より前に出しておく
    privacy_policy:
      analytics_blink_scan: "ただし、まばたき入力の画面では Google Analytics を読み込みません。また、この画面から別の画面へ移った時に、この画面の URL が移動先の解析に渡らないようにしています。"
      deletion_blink_scan: "まばたき入力の調整値は、この端末のブラウザに保存されるため、ログアウトや退会では消えません。消すには、まばたき入力の画面の「この端末の調整値を消す」を押すか、ブラウザの設定でこのサイトのデータを消去してください。"
      blink_input:
        heading: "8. まばたき入力（カメラ）について"
        lead: "まばたき入力の画面では、端末のカメラでまばたきを読み取ります。この画面での情報の扱いは次のとおりです。"
        items:
          - "カメラの映像は、この端末の中だけで目の開き具合の判定に使います。映像・画像・目の開き具合の数値を、サーバーへ送ったり保存したりすることはありません。"
          - "判定に使うプログラムとモデル（MediaPipe）は本サービスのサーバーから読み込み、端末の中で動かします。"
          - "選んだ文はサーバーへ送ります。ログイン中は、ほかの画面と同じく選択履歴（MessageLog）として保存します。ログインしていない場合は履歴に保存しませんが、完了の表示などのため、直前に選んだ文と送信の番号をセッション（ブラウザの Cookie）に記録します。"
          - "調整値（目を開いた時と閉じた時の数値、保存した日時、使う目など）は、この端末のブラウザ（localStorage）に保存します。ユーザーIDや映像は含みません。保存しない使い方も選べます。"
          - "ふつうのアクセス記録や、画面の表示に使う Google Fonts への通信は、ほかの画面と同じように発生します。"
    guide:
      blink_input:
        heading: "まばたき入力（カメラ）のデータの扱い"
        preparing: "まばたき入力（カメラでまばたきを読み取る機能）は準備中です。使えるようになる前に、データの扱いをお知らせします。"
        items:
          - title: "映像は端末の中だけで使います"
            description: "カメラの映像は、この端末の中だけで目の開き具合の判定に使い、保存も送信もしません。サーバーへ送るのは、選んだ文だけです。"
            icon: "videocam"
          - title: "調整値はこの端末に保存します"
            description: "目の開き具合の調整値は、この端末のブラウザに保存します。ほかの方と端末を共用する場合は、使い終わったら消してください。"
            icon: "tune"
          - title: "この画面ではアクセス解析を使いません"
            description: "まばたき入力の画面では、Google Analytics を読み込みません。"
            icon: "visibility_off"
          - title: "調整値の消し方"
            description: "まばたき入力の画面の「この端末の調整値を消す」を押すか、ブラウザの設定でこのサイトのデータを消去してください。ログアウトや退会では消えません。"
            icon: "delete"
        privacy_policy_link: "くわしくはプライバシーポリシーへ"
